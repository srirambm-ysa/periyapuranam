# Periyapuranam storefront — build-then-deploy.
#
# Secrets required for the deploy job (repo Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN    (Workers deploy perm; zone perms NOT needed until
#                            the custom domain is attached — see wrangler.toml)
#   CLOUDFLARE_ACCOUNT_ID
# PRs run the full pipeline through assembly and upload dist/ as a preview
# artifact (download + serve locally). True URL previews (workers.dev branch
# URLs / version previews) need dashboard Git integration or a zone token, so
# they stay a human step — not half-wired here.
name: storefront

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build TK artifact + golden diff
        run: python3 scripts/build.py --check
      - name: CI gates (schema, status, counts, drawer, manifest, escaping)
        run: python3 scripts/check.py
      - name: Assemble dist/
        run: python3 scripts/assemble_dist.py --clean
      - name: Upload dist preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-preview
          path: dist/
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild + gate + assemble (never deploy unbuilt dist/)
        run: |
          python3 scripts/build.py --check
          python3 scripts/check.py
          python3 scripts/assemble_dist.py --clean
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
